<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome - Insurance Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa; /* Light cyan background for a fresh look */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff; /* Pure white container */
            max-width: 900px; /* Slightly wider container */
            width: 100%;
            padding: 40px; /* Increased padding for more space */
            border-radius: 15px; /* Slightly rounder corners */
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.15); /* Softer shadow */
            text-align: center;
        }

        h1 {
            color: #1e88e5; /* Dark blue for headings */
            margin-bottom: 25px;
            font-size: 2.5em; /* Larger heading */
            font-weight: bold;
        }

        p {
            color: #424242; /* Darker gray for readability */
            margin-bottom: 35px;
            line-height: 1.8; /* More spacing between lines */
            font-size: 1.2em; /* Larger paragraph text */
        }

        .button {
            background-color: #2e7d32; /* Deeper green for button */
            color: white;
            padding: 15px 30px; /* Larger button padding */
            border: none;
            border-radius: 6px; /* Slightly rounder button */
            cursor: pointer;
            font-size: 18px; /* Larger button text */
            transition: background-color 0.3s, transform 0.2s; /* Added transform for hover effect */
            display: inline-block;
            text-decoration: none;
        }

        .button:hover {
            background-color: #1b5e20; /* Even darker green on hover */
            transform: scale(1.05); /* Slight scale up on hover for interactivity */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Insurance Cost Prediction</h1>
        <p>Please enter your details to get started:</p>
        <form action="/input" method="get">
            <button type="submit" class="button">Proceed to Input</button>
        </form>
    </div>
</body>
</html>
